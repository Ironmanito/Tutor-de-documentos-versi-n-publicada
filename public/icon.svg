<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo Dorado Profundo e Imperial (Golden Noir) -->
    <radialGradient id="iconGoldenBg" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#2E1C07" />
      <stop offset="45%" stop-color="#1C1104" />
      <stop offset="78%" stop-color="#100A02" />
      <stop offset="100%" stop-color="#080501" />
    </radialGradient>

    <!-- Halo Dorado Central -->
    <radialGradient id="iconCenterAura" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#D97706" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#78350F" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Gradiente para la Espiral Principal -->
    <linearGradient id="iconSpiral1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="35%" stop-color="#D97706" />
      <stop offset="70%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FFFBEB" />
    </linearGradient>

    <!-- Gradiente para la Contra-Espiral -->
    <linearGradient id="iconSpiral2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Gradiente Flor de la Vida -->
    <linearGradient id="iconFlowerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#FBBF24" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Squircle Contenedor Exterior -->
  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#iconGoldenBg)" />
  <rect x="8" y="8" width="496" height="496" rx="112" stroke="#F59E0B" stroke-opacity="0.2" stroke-width="1.8" fill="none" />
  <rect x="18" y="18" width="476" height="476" rx="104" stroke="#FDE68A" stroke-opacity="0.08" stroke-width="1" fill="none" />

  <!-- Aura central dorada -->
  <circle cx="256" cy="256" r="210" fill="url(#iconCenterAura)" />

  <!-- Guías sutiles de Fibonacci -->
  <g stroke="#F59E0B" stroke-width="1" stroke-dasharray="3 3" opacity="0.2">
    <circle cx="256" cy="256" r="55" fill="none" />
    <circle cx="256" cy="256" r="89" fill="none" />
    <circle cx="256" cy="256" r="144" fill="none" />
    <circle cx="256" cy="256" r="233" stroke-opacity="0.35" fill="none" />
  </g>

  <!-- ================= 1. FLOR DE LA VIDA (R = 68) ================= -->
  <g stroke="url(#iconFlowerGold)" stroke-width="1.5" fill="none">
    <circle cx="256" cy="256" r="68" />
    <!-- 6 círculos primarios -->
    <circle cx="324" cy="256" r="68" />
    <circle cx="290" cy="314.89" r="68" />
    <circle cx="222" cy="314.89" r="68" />
    <circle cx="188" cy="256" r="68" />
    <circle cx="222" cy="197.11" r="68" />
    <circle cx="290" cy="197.11" r="68" />

    <!-- 6 círculos secundarios -->
    <circle cx="357.96" cy="314.89" r="68" stroke-opacity="0.35" />
    <circle cx="256" cy="373.78" r="68" stroke-opacity="0.35" />
    <circle cx="154.04" cy="314.89" r="68" stroke-opacity="0.35" />
    <circle cx="154.04" cy="197.11" r="68" stroke-opacity="0.35" />
    <circle cx="256" cy="138.22" r="68" stroke-opacity="0.35" />
    <circle cx="357.96" cy="197.11" r="68" stroke-opacity="0.35" />

    <!-- Anillo de contención -->
    <circle cx="256" cy="256" r="136" stroke="#FBBF24" stroke-width="1.8" stroke-opacity="0.6" />
  </g>

  <!-- ================= 2. ESPIRAL ÁUREA PRINCIPAL ================= -->
  <path
    d="M 256 256 A 13 13 0 0 1 243 269 A 21 21 0 0 1 222 248 A 34 34 0 0 1 256 214 A 55 55 0 0 1 311 269 A 89 89 0 0 1 222 358 A 144 144 0 0 1 78 214 A 233 233 0 0 1 311 -19"
    fill="none"
    stroke="#F59E0B"
    stroke-width="9"
    stroke-linecap="round"
    stroke-opacity="0.25"
  />
  <path
    d="M 256 256 A 13 13 0 0 1 243 269 A 21 21 0 0 1 222 248 A 34 34 0 0 1 256 214 A 55 55 0 0 1 311 269 A 89 89 0 0 1 222 358 A 144 144 0 0 1 78 214 A 233 233 0 0 1 311 -19"
    fill="none"
    stroke="url(#iconSpiral1)"
    stroke-width="4.2"
    stroke-linecap="round"
  />

  <!-- ================= 3. CONTRA-ESPIRAL ÁUREA EXACTA ================= -->
  <g transform="rotate(180, 256, 256)">
    <path
      d="M 256 256 A 13 13 0 0 1 243 269 A 21 21 0 0 1 222 248 A 34 34 0 0 1 256 214 A 55 55 0 0 1 311 269 A 89 89 0 0 1 222 358 A 144 144 0 0 1 78 214 A 233 233 0 0 1 311 -19"
      fill="none"
      stroke="#FDE68A"
      stroke-width="8"
      stroke-linecap="round"
      stroke-opacity="0.2"
    />
    <path
      d="M 256 256 A 13 13 0 0 1 243 269 A 21 21 0 0 1 222 248 A 34 34 0 0 1 256 214 A 55 55 0 0 1 311 269 A 89 89 0 0 1 222 358 A 144 144 0 0 1 78 214 A 233 233 0 0 1 311 -19"
      fill="none"
      stroke="url(#iconSpiral2)"
      stroke-width="4.2"
      stroke-linecap="round"
    />
  </g>

  <!-- ================= 4. ESTRELLA ÁUREA DE 5 PUNTAS (PENTAGRAMA) ================= -->
  <g transform="translate(256, 256)">
    <!-- Polígono de fondo de la estrella -->
    <polygon
      points="0,-89 21,-29 85,-27 34,11 52,72 0,34 -52,72 -34,11 -85,-27 -21,-29"
      fill="#F59E0B"
      fill-opacity="0.22"
      stroke="url(#iconSpiral1)"
      stroke-width="3.6"
      stroke-linejoin="round"
    />

    <!-- Cruce geométrico interno sagrado -->
    <polygon
      points="0,-89 52,72 -85,-27 85,-27 -52,72"
      fill="none"
      stroke="#FFFBEB"
      stroke-width="2.2"
      stroke-opacity="0.95"
      stroke-linejoin="round"
    />

    <!-- Micro-núcleo de estrella central (R=21) -->
    <polygon
      points="0,-21 5,-7 20,-6 8,3 12,17 0,8 -12,17 -8,3 -20,-6 -5,-7"
      fill="#FFFFFF"
      stroke="#F59E0B"
      stroke-width="1.2"
    />
    <circle cx="0" cy="0" r="4" fill="#F59E0B" />
  </g>

  <!-- Vértices en las 5 puntas -->
  <!-- 0° (-90° cartesian) -> (256, 167) -->
  <circle cx="256" cy="167" r="5" fill="#FFFFFF" />
  <circle cx="256" cy="167" r="10" stroke="#FBBF24" stroke-width="1.6" stroke-opacity="0.85" fill="none" />
  <!-- 72° (-18° cartesian) -> (340.64, 228.49) -->
  <circle cx="340.64" cy="228.49" r="5" fill="#FFFFFF" />
  <circle cx="340.64" cy="228.49" r="10" stroke="#FBBF24" stroke-width="1.6" stroke-opacity="0.85" fill="none" />
  <!-- 144° (54° cartesian) -> (308.31, 328.01) -->
  <circle cx="308.31" cy="328.01" r="5" fill="#FFFFFF" />
  <circle cx="308.31" cy="328.01" r="10" stroke="#FBBF24" stroke-width="1.6" stroke-opacity="0.85" fill="none" />
  <!-- 216° (126° cartesian) -> (203.69, 328.01) -->
  <circle cx="203.69" cy="328.01" r="5" fill="#FFFFFF" />
  <circle cx="203.69" cy="328.01" r="10" stroke="#FBBF24" stroke-width="1.6" stroke-opacity="0.85" fill="none" />
  <!-- 288° (198° cartesian) -> (171.36, 228.49) -->
  <circle cx="171.36" cy="228.49" r="5" fill="#FFFFFF" />
  <circle cx="171.36" cy="228.49" r="10" stroke="#FBBF24" stroke-width="1.6" stroke-opacity="0.85" fill="none" />
</svg>
