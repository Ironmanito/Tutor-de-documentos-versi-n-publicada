<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="50%" stop-color="#0E0E11" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D00" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#FF7A00" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.7" />
    </linearGradient>

    <!-- Electric Orange Accent Gradient -->
    <linearGradient id="accentOrange" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E03800" />
      <stop offset="50%" stop-color="#FF4D00" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>

    <!-- Cyan Voice Wave Gradient -->
    <linearGradient id="voiceCyan" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>

    <!-- Left Page Fill -->
    <linearGradient id="leftPageGrad" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#1F1F26" />
      <stop offset="100%" stop-color="#15151B" />
    </linearGradient>

    <!-- Right Page Fill -->
    <linearGradient id="rightPageGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#24242D" />
      <stop offset="100%" stop-color="#181820" />
    </linearGradient>

    <!-- Ambient Glow behind notebook -->
    <radialGradient id="centerGlow" cx="50%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#FF4D00" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#FF4D00" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FF4D00" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Squircle with Dark High-End Canvas -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bgGrad)" />
  
  <!-- Subtle inner perimeter border -->
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="url(#borderGrad)" stroke-width="3" opacity="0.65" />

  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="245" r="180" fill="url(#centerGlow)" />

  <!-- ================= CUADERNO / NOTEBOOK BASE ================= -->
  <g transform="translate(0, 15)">
    <!-- Notebook Outer Drop Shadow -->
    <path d="M 96 325 C 160 305 240 315 256 332 C 272 315 352 305 416 325 C 416 338 272 376 256 376 C 240 376 96 338 96 325 Z" fill="#000000" opacity="0.5" />

    <!-- Left Page Base (Perspective) -->
    <path d="M 104 316 C 164 298 238 308 252 322 L 252 186 C 238 174 164 162 104 180 Z" 
          fill="url(#leftPageGrad)" 
          stroke="#323240" 
          stroke-width="2.5" 
          stroke-linejoin="round" />

    <!-- Right Page Base (Perspective) -->
    <path d="M 260 322 C 274 308 348 298 408 316 L 408 180 C 348 162 274 174 260 186 Z" 
          fill="url(#rightPageGrad)" 
          stroke="#383848" 
          stroke-width="2.5" 
          stroke-linejoin="round" />

    <!-- Page Layers (Leaf edges giving depth) -->
    <path d="M 104 316 L 104 322 C 164 304 238 314 252 328 L 252 322" fill="none" stroke="#FF4D00" stroke-width="2" opacity="0.4" />
    <path d="M 408 316 L 408 322 C 348 304 274 314 260 328 L 260 322" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.4" />

    <!-- Notebook Text Lines (Left Page) -->
    <line x1="132" y1="210" x2="228" y2="202" stroke="#525266" stroke-width="4" stroke-linecap="round" opacity="0.7" />
    <line x1="132" y1="236" x2="228" y2="228" stroke="#525266" stroke-width="4" stroke-linecap="round" opacity="0.7" />
    <line x1="132" y1="262" x2="200" y2="255" stroke="#525266" stroke-width="4" stroke-linecap="round" opacity="0.5" />
    <line x1="132" y1="288" x2="216" y2="281" stroke="#FF4D00" stroke-width="4" stroke-linecap="round" opacity="0.6" />

    <!-- Notebook Text Lines (Right Page) -->
    <line x1="284" y1="202" x2="380" y2="210" stroke="#525266" stroke-width="4" stroke-linecap="round" opacity="0.7" />
    <line x1="284" y1="228" x2="380" y2="236" stroke="#525266" stroke-width="4" stroke-linecap="round" opacity="0.7" />
    <line x1="284" y1="255" x2="352" y2="262" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <line x1="284" y1="281" x2="368" y2="288" stroke="#525266" stroke-width="4" stroke-linecap="round" opacity="0.5" />

    <!-- Central Notebook Spine Glow -->
    <line x1="256" y1="182" x2="256" y2="328" stroke="#FF4D00" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- ================= TUTOR VOICE & AI SPARKS ================= -->
  <!-- Wave Bar 1 (Left-most, small) -->
  <rect x="188" y="142" width="10" height="42" rx="5" fill="url(#accentOrange)" opacity="0.8" />
  
  <!-- Wave Bar 2 (Mid-left) -->
  <rect x="210" y="112" width="11" height="80" rx="5.5" fill="url(#accentOrange)" />

  <!-- Central Crest: Neural Voice Pulse / AI Core -->
  <rect x="233" y="86" width="12" height="114" rx="6" fill="url(#accentOrange)" />
  <rect x="267" y="86" width="12" height="114" rx="6" fill="url(#accentOrange)" />

  <!-- Wave Bar 4 (Mid-right) -->
  <rect x="291" y="112" width="11" height="80" rx="5.5" fill="url(#voiceCyan)" />

  <!-- Wave Bar 5 (Right-most, small) -->
  <rect x="314" y="142" width="10" height="42" rx="5" fill="url(#voiceCyan)" opacity="0.85" />

  <!-- Floating AI Star Sparkle (Top Center) -->
  <g transform="translate(256, 68)">
    <path d="M 0 -22 Q 0 0 22 0 Q 0 0 0 22 Q 0 0 -22 0 Q 0 0 0 -22 Z" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="4.5" fill="#FF4D00" />
  </g>

  <!-- Secondary Mini Star Sparkle (Top Right) -->
  <g transform="translate(340, 102)">
    <path d="M 0 -11 Q 0 0 11 0 Q 0 0 0 11 Q 0 0 -11 0 Q 0 0 0 11 Z" fill="#38BDF8" />
  </g>

  <!-- Secondary Mini Star Sparkle (Top Left) -->
  <g transform="translate(172, 116)">
    <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8 Z" fill="#FFA000" />
  </g>
</svg>
