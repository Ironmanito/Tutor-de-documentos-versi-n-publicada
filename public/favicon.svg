<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="favGoldenBg" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#2E1C07" />
      <stop offset="45%" stop-color="#1C1104" />
      <stop offset="78%" stop-color="#100A02" />
      <stop offset="100%" stop-color="#080501" />
    </radialGradient>
    <radialGradient id="favCenterAura" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#D97706" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#78350F" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="favSpiral1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="35%" stop-color="#D97706" />
      <stop offset="70%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FFFBEB" />
    </linearGradient>
    <linearGradient id="favSpiral2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="favFlowerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#FBBF24" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#favGoldenBg)" />
  <rect x="8" y="8" width="496" height="496" rx="112" stroke="#F59E0B" stroke-opacity="0.25" stroke-width="2" fill="none" />
  <circle cx="256" cy="256" r="210" fill="url(#favCenterAura)" />

  <!-- Flor de la Vida -->
  <g stroke="url(#favFlowerGold)" stroke-width="1.8" fill="none">
    <circle cx="256" cy="256" r="68" />
    <circle cx="324" cy="256" r="68" />
    <circle cx="290" cy="314.89" r="68" />
    <circle cx="222" cy="314.89" r="68" />
    <circle cx="188" cy="256" r="68" />
    <circle cx="222" cy="197.11" r="68" />
    <circle cx="290" cy="197.11" r="68" />
    <circle cx="256" cy="256" r="136" stroke="#FBBF24" stroke-width="2" stroke-opacity="0.6" />
  </g>

  <!-- Espiral 1 -->
  <path
    d="M 256 256 A 13 13 0 0 1 243 269 A 21 21 0 0 1 222 248 A 34 34 0 0 1 256 214 A 55 55 0 0 1 311 269 A 89 89 0 0 1 222 358 A 144 144 0 0 1 78 214 A 233 233 0 0 1 311 -19"
    fill="none"
    stroke="url(#favSpiral1)"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- Contra-espiral 2 -->
  <g transform="rotate(180, 256, 256)">
    <path
      d="M 256 256 A 13 13 0 0 1 243 269 A 21 21 0 0 1 222 248 A 34 34 0 0 1 256 214 A 55 55 0 0 1 311 269 A 89 89 0 0 1 222 358 A 144 144 0 0 1 78 214 A 233 233 0 0 1 311 -19"
      fill="none"
      stroke="url(#favSpiral2)"
      stroke-width="5"
      stroke-linecap="round"
    />
  </g>

  <!-- Estrella de 5 puntas -->
  <g transform="translate(256, 256)">
    <polygon
      points="0,-89 21,-29 85,-27 34,11 52,72 0,34 -52,72 -34,11 -85,-27 -21,-29"
      fill="#F59E0B"
      fill-opacity="0.25"
      stroke="url(#favSpiral1)"
      stroke-width="4"
      stroke-linejoin="round"
    />
    <polygon
      points="0,-89 52,72 -85,-27 85,-27 -52,72"
      fill="none"
      stroke="#FFFBEB"
      stroke-width="2.5"
      stroke-linejoin="round"
    />
    <circle cx="0" cy="0" r="4.5" fill="#F59E0B" />
  </g>
</svg>
